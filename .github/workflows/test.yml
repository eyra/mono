name: Test & Lint

on:
  push:
    branches-ignore:
      - master

# Cancel superseded runs on the same ref so a new push stops the old job.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-26.04

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: core
          POSTGRES_PASSWORD: supersecret
        ports:
          - 5432:5432
        # needed because the postgres container does not provide a healthcheck
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      MIX_ENV: test
      POSTGRES_USER: core
      POSTGRES_PASS: supersecret
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - id: setup-elixir
        uses: erlef/setup-elixir@v1.24.1
        with:
          otp-version: "27.3.4"
          elixir-version: "1.19.6-otp-27"

      # Cache Mix deps + build artifacts. Key is scoped to OTP/Elixir + mix.lock;
      # restore-keys let us reuse a stale-lock build as a warm start.
      - name: Cache mix deps + build
        uses: actions/cache@v6.1.0
        with:
          path: |
            core/deps
            core/_build
          key: mix-${{ runner.os }}-otp-${{ steps.setup-elixir.outputs.otp-version }}-elixir-${{ steps.setup-elixir.outputs.elixir-version }}-${{ hashFiles('core/mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-otp-${{ steps.setup-elixir.outputs.otp-version }}-elixir-${{ steps.setup-elixir.outputs.elixir-version }}-

      - name: Cache Dialyzer PLTs
        uses: actions/cache@v6.1.0
        with:
          path: core/priv/plts
          key: plts-${{ runner.os }}-otp-${{ steps.setup-elixir.outputs.otp-version }}-elixir-${{ steps.setup-elixir.outputs.elixir-version }}-${{ hashFiles('core/mix.lock') }}
          restore-keys: |
            plts-${{ runner.os }}-otp-${{ steps.setup-elixir.outputs.otp-version }}-elixir-${{ steps.setup-elixir.outputs.elixir-version }}-

      - name: Cache npm node_modules
        uses: actions/cache@v6.1.0
        with:
          path: core/assets/node_modules
          key: npm-${{ runner.os }}-${{ hashFiles('core/assets/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Setup the Elixir project
        run: make deps

      - name: Format
        run: make format
        continue-on-error: true

      - name: Commit formatted code
        uses: EndBug/add-and-commit@v11.1.1
        with:
          add: "."
          message: "Formatted code"
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compile
        run: make compile

      - name: Build assets
        run: |
          cd core/assets && npm install
          cd .. && mix assets.build

      - name: Unit tests
        run: cd core && mix test.unit

      # Wallaby needs a chromedriver whose major version matches Chrome.
      - id: setup-chrome
        uses: browser-actions/setup-chrome@v2.2.0
        with:
          chrome-version: "155"
          install-chromedriver: true
          install-dependencies: true

      - name: Feature tests
        run: cd core && mix test.feature
        env:
          CHROME_BINARY: ${{ steps.setup-chrome.outputs.chrome-path }}
          CHROMEDRIVER_PATH: ${{ steps.setup-chrome.outputs.chromedriver-path }}

      - name: Upload Wallaby screenshots
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: wallaby-screenshots
          path: core/tmp/wallaby_screenshots
          if-no-files-found: ignore

      - name: JS tests
        run: cd core && mix test.js

      - name: Credo
        run: make credo

      - name: Boundary check (Nova migration)
        run: cd core && elixir scripts/boundary_check.exs

      # Every function component has a story (`mix storybook.stories` writes missing ones).
      - name: Storybook stories
        run: cd core && mix storybook.check

      # Routes, grants, handlers, SaaS config and counts of the Next build.
      - name: Nova snapshots (Next)
        run: cd core && mix nova.snapshot

      - name: Dialyzer
        run: make dialyzer

  # The Self build (BUNDLE=self) against its Nova snapshots. MIX_ENV=dev, because
  # config/test.exs pins the bundle to Next. No database needed.
  snapshot-self:
    runs-on: ubuntu-26.04
    env:
      MIX_ENV: dev
      BUNDLE: self
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - id: setup-elixir
        uses: erlef/setup-elixir@v1.24.1
        with:
          otp-version: "27.3.4"
          elixir-version: "1.19.6-otp-27"

      - name: Cache mix deps + build
        uses: actions/cache@v6.1.0
        with:
          path: |
            core/deps
            core/_build
          key: mix-self-${{ runner.os }}-otp-${{ steps.setup-elixir.outputs.otp-version }}-elixir-${{ steps.setup-elixir.outputs.elixir-version }}-${{ hashFiles('core/mix.lock') }}
          restore-keys: |
            mix-self-${{ runner.os }}-otp-${{ steps.setup-elixir.outputs.otp-version }}-elixir-${{ steps.setup-elixir.outputs.elixir-version }}-

      - name: Setup the Elixir project
        run: make deps

      - name: Nova snapshots (Self)
        run: cd core && mix nova.snapshot
