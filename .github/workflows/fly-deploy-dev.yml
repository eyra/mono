name: Deploy to Fly.io (dev)

on:
  push:
    branches:
      - develop

# One deploy or E2E run at a time: a newer deploy must not restart the app
# under a running E2E job or finish before an older one.
concurrency:
  group: fly-deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Fly.io (dev)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set VERSION
        run: |
          VERSION="next_$(date +%F)_${{ github.run_number }}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          # AppSignal revision, set per deploy (never baked into the image).
          echo "APPSIGNAL_REVISION=develop_${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Setup Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Destroy stopped release machines
        run: |
          flyctl machines list --app eyra-next-dev --json \
            | jq -r '.[] | select(.state == "stopped") | select(.config.metadata.fly_release_command == "1") | .id' \
            | xargs -r -I {} flyctl machines destroy {} --app eyra-next-dev --force
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_DEV }}

      - name: Deploy to Fly.io
        run: |
          flyctl deploy --remote-only -c fly.dev.toml \
            --env APPSIGNAL_REVISION=${{ env.APPSIGNAL_REVISION }} \
            --build-arg VERSION=${{ env.VERSION }} \
            --build-arg GIT_COMMIT=${{ github.sha }}
        working-directory: core
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_DEV }}

  e2e:
    name: E2E Tests (dev)
    needs: deploy
    uses: ./.github/workflows/e2e.yml
    with:
      app_name: eyra-next-dev
    secrets:
      SERVICE_LOGIN_KEY: ${{ secrets.SERVICE_LOGIN_KEY }}
