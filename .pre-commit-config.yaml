# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
#
# Two stages are wired up:
#   pre-commit — fast checks (< 30s): format, credo, incremental compile
#   pre-push   — heavy checks (test suite + dialyzer)
#
# One-time setup after cloning:
#   pre-commit install --hook-type pre-commit --hook-type pre-push
fail_fast: true
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: no-commit-to-branch
        args: [-b, master]
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v2.7.1
    hooks:
      - id: prettier
        types_or: [css, javascript]
  - repo: local
    hooks:
      - id: mix-format
        name: "elixir: mix format"
        entry: mix format
        language: system
        files: \.exs?$

      - id: mix-compile
        name: "elixir: mix compile"
        entry: make compile
        language: system
        pass_filenames: false
        files: \.ex$

      - id: mix-credo
        name: "elixir: mix credo"
        entry: make credo
        language: system
        pass_filenames: false
        files: \.exs*$

      - id: mix-test
        name: "elixir: mix test (pre-push)"
        entry: make test
        language: system
        pass_filenames: false
        files: \.exs?$
        stages: [pre-push]

      - id: mix-dialyzer
        name: "elixir: mix dialyzer (pre-push)"
        entry: make dialyzer
        language: system
        pass_filenames: false
        files: \.exs?$
        stages: [pre-push]
